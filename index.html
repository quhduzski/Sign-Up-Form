<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-modal">
      <div class="close-icon">ⓧ</div>

      <h2>Sign Up</h2>
      <p>
        By signing up, you agree to our terms and conditions. Learn about our
        privacy policy before submitting your form
      </p>

      <form action="">
        <input
          type="text"
          name="username"
          id="username"
          placeholder="Username"
        />
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Password"
        />
        <input
          type="password"
          name="confirm passwrod"
          id="confirm password"
          placeholder="Confirm Password"
        />

        <label for="checkbox"
          ><input type="checkbox" name="checkbox" id="checkbox" required />I
          have read and agreed to the terms and conditions</label
        >

        <input type="submit" name="submit" id="submit" />
      </form>

      <hr />

      <h2>Download our App</h2>

      <div class="download-links">
        <a href="https://play.google.com/store">
          <img src="images/Google Play Store.png" alt="Google Play Store" />
        </a>
        <a href="https://www.apple.com/store">
          <img src="images/App Store.png" alt="App Store" />
        </a>
      </div>
    </div>
  </body>
</html>
